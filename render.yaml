# Render Blueprint — portfolio API
# Docs: https://render.com/docs/blueprint-specification
#
# Set these secrets in the Render dashboard (Environment tab):
#   RESEND_API_KEY, MAIL_TO, MAIL_FROM, VERIFICATION_SECRET, CORS_ORIGIN

services:
  - type: web
    name: portfolio-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: TRUST_PROXY
        value: "1"
